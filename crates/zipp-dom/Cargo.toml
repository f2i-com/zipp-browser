[package]
name = "zipp-dom"
description = "DOM, traits, HTML parsing, and Stylo-Taffy bridge for Zipp Browser"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = [
    "svg",
    "woff-rust",
    "system_fonts",
    "block",
    "flexbox",
    "grid",
    "tracing",
    "file_input",
]
accessibility = []
tracing = ["dep:tracing"]
svg = ["dep:usvg"]
# WOFF decoding using the "woff" crate (C bindings)
woff-c = ["dep:woff"]
# WOFF decoding using the "wuff" crate (pure Rust)
woff-rust = ["dep:wuff"]
system_fonts = ["parley/system"]
autofocus = []
block = ["taffy/block_layout"]
floats = ["taffy/float_layout"]
flexbox = ["taffy/flexbox"]
file_input = []
incremental = []
parallel-construct = []
grid = ["taffy/grid"]
log_phase_times = ["dep:debug_timer", "debug_timer/enable"]

[dependencies]
# Servo dependencies
style = { workspace = true }
style_traits = { workspace = true }
style_atoms = { workspace = true }
style_config = { workspace = true }
style_dom = { workspace = true }
selectors = { workspace = true }
cssparser = { workspace = true }
app_units = { workspace = true }
euclid = { workspace = true }
atomic_refcell = { workspace = true }
smallvec = { workspace = true }

# HTML5ever (for HTML parser)
markup5ever = { workspace = true }
html5ever = { workspace = true }
xml5ever = { workspace = true }

# Taffy layout
taffy = { workspace = true }

# Linebender / Fontations
parley = { workspace = true }
skrifa = { workspace = true }
linebender_resource_handle = { workspace = true }
color = { workspace = true }
kurbo = { workspace = true }

# Traits sub-crate deps (merged from blitz-traits)
http = { workspace = true }
url = { workspace = true }
bytes = { workspace = true }
keyboard-types = { workspace = true }
smol_str = { workspace = true }
bitflags = { workspace = true }
cursor-icon = { workspace = true }
serde = { workspace = true }

# DOM deps
slab = { workspace = true }
fastrand = { workspace = true }
rayon = { workspace = true }
thread_local = { workspace = true }

# Media & Decoding
image = { workspace = true }
usvg = { workspace = true, optional = true }
woff = { workspace = true, optional = true, features = ["version1", "version2"] }
wuff = { workspace = true, optional = true }
html-escape = { workspace = true }
percent-encoding = { workspace = true }

# Tracing (optional)
tracing = { workspace = true, optional = true }

# Phase timing (optional)
debug_timer = { version = "0.1.2", optional = true }

# HACK: Blitz doesn't need to depend on objc2 directly. But this feature flag is necessary
# to prevent debug builds from panicking.
[target.'cfg(any(target_vendor = "apple"))'.dependencies]
objc2 = { version = "0.6", features = ["disable-encoding-assertions"] }
