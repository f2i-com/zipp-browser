<!DOCTYPE html><html><head><title>Grid Test</title></head>
<body style="margin:0;font-family:Arial">
<div style="display:grid;grid-template-columns:200px 1fr;gap:10px;padding:20px;min-height:100vh">
  <div style="background:#f0f0f0;padding:20px">
    <h3>Sidebar</h3>
    <p>Navigation links</p>
    <ul><li>Home</li><li>About</li><li>Contact</li></ul>
  </div>
  <div style="padding:20px">
    <h1>Main Content</h1>
    <p>This is the main content area using CSS Grid layout.</p>
    <p>The sidebar should be 200px wide on the left, and this content should fill the rest.</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:20px">
      <div style="background:#e3f2fd;padding:15px;border-radius:8px"><h3>Card 1</h3><p>Grid within grid</p></div>
      <div style="background:#e8f5e9;padding:15px;border-radius:8px"><h3>Card 2</h3><p>Three columns</p></div>
      <div style="background:#fff3e0;padding:15px;border-radius:8px"><h3>Card 3</h3><p>Using repeat(3,1fr)</p></div>
    </div>
  </div>
</div>
</body></html>
