[package]
name = "zipp-browser"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[[bin]]
name = "zipp-browser"
path = "src/main.rs"

[[bin]]
name = "test-inline"
path = "src/test.rs"

[features]
default = ["svg", "system_fonts", "grid", "tracing", "net", "floats", "cookies"]
svg = [
    "zipp-dom/svg",
    "zipp-renderer/svg",
]
system_fonts = ["zipp-dom/system_fonts"]
grid = ["zipp-dom/grid"]
tracing = [
    "dep:tracing-subscriber",
    "zipp-dom/tracing",
    "zipp-renderer/tracing",
    "zipp-shell/tracing",
]
net = ["dep:tokio", "dep:url"]
floats = ["zipp-dom/floats"]
cookies = ["zipp-shell/cookies"]
cache = ["zipp-shell/cache"]
http2 = ["zipp-shell/http2"]

[dependencies]
# Parsing ES modules so their import/export statements can be rewritten by byte
# span rather than pattern-matched out of minified source. zipp-vm has its own
# parser and does not expose it, so this is the browser's own dependency.
oxc_allocator = "0.126.0"
oxc_ast = "0.126.0"
oxc_ast_visit = "0.126.0"
oxc_parser = "0.126.0"
oxc_span = "0.126.0"
# The page's body, parsed for the DOM shim to start from (`seed.rs`).
html5ever = { workspace = true }

# In-repo workspace crates
zipp-dom = { workspace = true, features = ["default", "woff-rust", "parallel-construct"] }
zipp-renderer = { workspace = true, features = ["default"] }
zipp-shell = { workspace = true, features = ["default", "http2"] }

# Zipp JS engine — ZIPP's register VM + x86-64/ARM64 JIT, consumed through
# its `embed` module (persistent VM: compile once, keep alive, eval + dispatch
# event handlers into the same global context). Pinned to a ZIPP release tag;
# to build against a local zipp.org checkout instead, see the README.
# The `web-assembly` branch: the WebAssembly JS API (vm/webassembly).
zipp-vm = { git = "https://github.com/f2i-com/zipp.org", branch = "web-assembly" }

# Linebender
linebender_resource_handle = { workspace = true }

# IO & Networking
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
url = { workspace = true, features = ["serde"], optional = true }
reqwest = { workspace = true, features = ["blocking", "rustls-tls", "cookies"] }
mimalloc = { version = "0.1.52", default-features = false }

# PDF viewer: pure-Rust PDF rasteriser, one PNG per page (src/viewers.rs).
hayro = "0.8.0"

# Utilities
base64 = "0.22"
lazy_static = "1"
stacker = "0.1"
urlencoding = "2"

# Tracing (optional)
tracing-subscriber = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }

# Reading the OS colour scheme before the window exists (`system_prefers_dark`).
# Already in the tree through winit; this only adds the registry bindings.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry"] }

# `<video>` playback through Media Foundation's media engine (`media.rs`).
# Already in the tree at this version; these add the bindings it needs.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
# WebGL (`webgl.rs`): OpenGL calls, and the batches page script sends.
glow = "0.18"
serde_json = "1"
# Modifier keys on the events page script is given.
keyboard-types = { workspace = true }
# Canvas 2D (`canvas2d.rs`): drawn with tiny-skia, text from the embedded
# faces' outlines, CSS colours parsed, `Path2D` strings read as SVG paths.
tiny-skia = { workspace = true }
skrifa = { workspace = true }
color = "0.3"
svgtypes = "0.16"
# Image textures, decoded from their bytes.
image = { workspace = true }
windows-core = "0.62"
# WebGPU (`webgpu.rs`): wgpu implements it; pollster waits on its futures.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "dx12"] }
pollster = "1"

