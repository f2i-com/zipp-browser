[package]
name = "zipp-browser"
version = "0.1.1"
edition = "2024"
rust-version.workspace = true
publish = false

[[bin]]
name = "zipp-browser"
path = "src/main.rs"

[[bin]]
name = "test-inline"
path = "src/test.rs"

[features]
default = ["svg", "system_fonts", "grid", "tracing", "net", "floats", "cookies"]
svg = [
    "zipp-dom/svg",
    "zipp-renderer/svg",
]
system_fonts = ["zipp-dom/system_fonts"]
grid = ["zipp-dom/grid"]
tracing = [
    "dep:tracing-subscriber",
    "zipp-dom/tracing",
    "zipp-renderer/tracing",
    "zipp-shell/tracing",
]
net = ["dep:tokio", "dep:url"]
floats = ["zipp-dom/floats"]
cookies = ["zipp-shell/cookies"]
cache = ["zipp-shell/cache"]
http2 = ["zipp-shell/http2"]

[dependencies]
# The machine's randomness for `crypto.getRandomValues` and `randomUUID`.
getrandom = "0.3"
# Parsing ES modules so their import/export statements can be rewritten by byte
# span rather than pattern-matched out of minified source. zipp-vm has its own
# parser and does not expose it, so this is the browser's own dependency.
oxc_allocator = "0.126.0"
oxc_ast = "0.126.0"
oxc_ast_visit = "0.126.0"
oxc_parser = "0.126.0"
oxc_span = "0.126.0"
# The page's body, parsed for the DOM shim to start from (`seed.rs`).
html5ever = { workspace = true }

# In-repo workspace crates
# zipp-dom's defaults less `system_fonts`, which is this crate's own feature:
# asking for zipp-dom's `default` turned it on whatever this crate's features said.
zipp-dom = { workspace = true, features = ["svg", "woff-rust", "block", "flexbox", "grid", "tracing", "file_input", "parallel-construct"] }
zipp-renderer = { workspace = true, features = ["default"] }
# `cookies`: the page loader and `document.cookie` use the shell's jar.
zipp-shell = { workspace = true, features = ["default", "http2", "cookies"] }
# The window's icon (`app_icon`). Already in the tree through zipp-shell.
winit = { workspace = true }

# Zipp JS engine — ZIPP's register VM + x86-64/ARM64 JIT, consumed through
# its `embed` module (persistent VM: compile once, keep alive, eval + dispatch
# event handlers into the same global context). ZIPP's `dev` branch, which has
# the WebAssembly JS API (vm/webassembly); Cargo.lock pins the commit, and
# `cargo update -p zipp-vm` moves to the newest. To build against a local
# zipp.org checkout instead, see the README. WebAssembly compiled to machine
# code (`wasm-jit`, Wasmtime) rather than interpreted: the zipp.org
# playground's engine runs some ten times faster.
zipp-vm = { git = "https://github.com/f2i-com/zipp.org", branch = "dev", features = ["wasm-jit"] }

# Linebender
linebender_resource_handle = { workspace = true }

# IO & Networking
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
url = { workspace = true, features = ["serde"], optional = true }
reqwest = { workspace = true, features = ["blocking", "rustls-tls", "cookies"] }
mimalloc = { version = "0.1.52", default-features = false }

# PDF viewer: pure-Rust PDF rasteriser, one PNG per page (src/viewers.rs).
hayro = "0.8.0"

# Batches page script sends (Canvas 2D, WebGL, WebGPU).
serde_json = "1"
# Modifier keys on the events page script is given.
keyboard-types = { workspace = true }
# Canvas 2D (`canvas2d.rs`): drawn with tiny-skia, text from the embedded
# faces' outlines, CSS colours parsed, `Path2D` strings read as SVG paths.
tiny-skia = { workspace = true }
skrifa = { workspace = true }
color = "0.3"
svgtypes = "0.16"
# Images decoded from their bytes: `naturalWidth`, and WebGL textures.
image = { workspace = true }
# Audio files decoded for Web Audio and `<audio>` (`audio.rs`).
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm", "isomp4", "aac"] }

# Utilities
base64 = "0.22"
lazy_static = "1"
stacker = "0.1"
urlencoding = "2"

# Tracing (optional)
tracing-subscriber = { workspace = true, optional = true }

# The icon (`assets/zipp.ico`) compiled into the Windows .exe (`build.rs`).
[build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }

# `--kiosk`: the whole screen through DRM/KMS, input from evdev, no display
# server (zipp-linux).
[target.'cfg(target_os = "linux")'.dependencies]
zipp-kms = { path = "../../crates/zipp-kms" }
# WebGPU (`webgpu.rs`) on Vulkan; WebGL's contexts (`webgl.rs`) through EGL,
# whose library is opened at run time.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan"] }
libloading = "0.8"
# WebUSB (`usb.rs`): usbfs's ioctls, poll and eventfd.
libc = "0.2"
# Sound out through ALSA (`audio.rs`).
alsa = "0.9"
# A Wayland server for Linux apps' windows (`wayland.rs`): the protocol in
# Rust (no libwayland), and xdg-shell's and its decorations' definitions.
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "unstable"] }

# Reading the OS colour scheme before the window exists (`system_prefers_dark`).
# Already in the tree through winit; this only adds the registry bindings.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry"] }

# `<video>` playback through Media Foundation's media engine (`media.rs`).
# Already in the tree at this version; these add the bindings it needs.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Variant",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
# WebGPU (`webgpu.rs`) on Vulkan or Direct3D 12.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "dx12"] }

# WebGL on desktop OpenGL (`webgl.rs`) and WebGPU on wgpu (`webgpu.rs`), on
# Windows and Linux.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
# OpenGL calls, and the batches page script sends.
glow = "0.18"
# pollster waits on wgpu's futures.
pollster = "1"

