<!DOCTYPE html><html><head><meta charset="utf-8"><title>FormLogic JS Test</title></head>
<body style="font-family:Arial,sans-serif;padding:20px;max-width:800px;margin:0 auto">
<h1 id="title">FormLogic JS Test Suite</h1>
<div id="results" style="padding:10px"></div>
<script>
// Test suite for FormLogic VM + DOM shim
var results = [];
var pass = 0, fail = 0;

function test(name, fn) {
    try {
        var result = fn();
        if (result === true) { pass++; results.push('<div style="color:green">✓ ' + name + '</div>'); }
        else { fail++; results.push('<div style="color:red">✗ ' + name + ' (got: ' + result + ')</div>'); }
    } catch(e) {
        fail++; results.push('<div style="color:red">✗ ' + name + ' (ERROR: ' + e.message + ')</div>');
    }
}

// === Core Language Features ===
test("let/const", function() { let a = 1; const b = 2; return a + b === 3; });
test("arrow functions", function() { var f = (x) => x * 2; return f(5) === 10; });
test("template literals", function() { var x = 42; return `val=${x}` === "val=42"; });
test("spread operator", function() { var a = [1,2]; var b = [...a, 3]; return b.length === 3 && b[2] === 3; });
test("rest parameters", function() { function f(a, ...rest) { return rest.length; } return f(1,2,3) === 2; });
test("default parameters", function() { function f(x, y) { if (y === undefined) y = 10; return x + y; } return f(5) === 15; });
test("for...of", function() { var sum = 0; for (var x of [1,2,3]) sum += x; return sum === 6; });
test("object destructuring", function() { var obj = {a:1, b:2}; var {a, b} = obj; return a === 1 && b === 2; });
test("array destructuring", function() { var [x, y] = [10, 20]; return x === 10 && y === 20; });
test("nested destructuring", function() { var {a: {b}} = {a: {b: 42}}; return b === 42; });
test("destructuring defaults", function() { var {x, y} = {x: 1}; if (y === undefined) y = 99; return x === 1; });
test("classes", function() { class Foo { constructor(v) { this.v = v; } get() { return this.v; } } return new Foo(7).get() === 7; });
test("class extends", function() { class A { val() { return 1; } } class B extends A { val() { return 2; } } return new B().val() === 2; });
test("try/catch", function() { try { throw new Error("test"); } catch(e) { return e.message === "test"; } return false; });
test("typeof", function() { return typeof undefined === "undefined" && typeof 42 === "number" && typeof "s" === "string"; });
test("ternary", function() { return (true ? "yes" : "no") === "yes"; });
test("regex test", function() { return /hello/.test("hello world"); });
test("regex match", function() { var m = "abc123".match(/[0-9]+/); return m && m[0] === "123"; });

// === Built-in Objects ===
test("JSON.parse", function() { return JSON.parse('{"a":1}').a === 1; });
test("JSON.stringify", function() { return JSON.stringify({b:2}) === '{"b":2}'; });
test("Math.floor", function() { return Math.floor(3.7) === 3; });
test("Math.random", function() { var r = Math.random(); return r >= 0 && r < 1; });
test("parseInt", function() { return parseInt("42") === 42; });
test("parseFloat", function() { return parseFloat("3.14") === 3.14; });
test("isNaN", function() { return isNaN(NaN) === true && isNaN(42) === false; });
test("encodeURIComponent", function() { return encodeURIComponent("a b") === "a%20b"; });
test("Date.now", function() { return typeof Date.now() === "number"; });

// === Array Methods ===
test("Array.isArray", function() { return Array.isArray([1,2]) === true; });
test("Array.from", function() { return Array.from("abc").length === 3; });
test("Array.map", function() { return [1,2,3].map(function(x){return x*2;}).join(",") === "2,4,6"; });
test("Array.filter", function() { return [1,2,3,4].filter(function(x){return x>2;}).length === 2; });
test("Array.find", function() { return [1,2,3].find(function(x){return x>1;}) === 2; });
test("Array.findIndex", function() { return [1,2,3].findIndex(function(x){return x>1;}) === 1; });
test("Array.includes", function() { return [1,2,3].includes(2) === true; });
test("Array.reduce", function() { return [1,2,3].reduce(function(a,b){return a+b;}, 0) === 6; });
test("Array.flat", function() { return [1,[2,[3]]].flat(2).length === 3; });
test("Array.at", function() { return [10,20,30].at(-1) === 30; });

// === String Methods ===
test("String.includes", function() { return "hello world".includes("world"); });
test("String.startsWith", function() { return "hello".startsWith("hel"); });
test("String.endsWith", function() { return "hello".endsWith("llo"); });
test("String.repeat", function() { return "ab".repeat(3) === "ababab"; });
test("String.padStart", function() { return "5".padStart(3, "0") === "005"; });
test("String.padEnd", function() { return "5".padEnd(3, "0") === "500"; });
test("String.trimStart", function() { return "  hi".trimStart() === "hi"; });
test("String.replaceAll", function() { return "a-b-c".replaceAll("-", "+") === "a+b+c"; });

// === Number ===
test("Number.isFinite", function() { return Number.isFinite(42) === true && Number.isFinite(Infinity) === false; });
test("Number.isNaN", function() { return Number.isNaN(NaN) === true && Number.isNaN(42) === false; });
test("Number.isInteger", function() { return Number.isInteger(5) === true && Number.isInteger(5.5) === false; });

// === Object Methods ===
test("Object.keys", function() { return Object.keys({a:1,b:2}).length === 2; });
test("Object.values", function() { return Object.values({a:1,b:2}).join(",") === "1,2"; });
test("Object.entries", function() { return Object.entries({a:1}).length === 1; });
test("Object.assign", function() { var o = Object.assign({}, {a:1}, {b:2}); return o.a === 1 && o.b === 2; });
test("Object.freeze", function() { var o = Object.freeze({x:1}); return o.x === 1; });

// === Map/Set ===
test("Map basic", function() { var m = new Map(); m.set("k", "v"); return m.get("k") === "v" && m.size === 1; });
test("Set basic", function() { var s = new Set(); s.add(1); s.add(1); s.add(2); return s.size === 2; });

// === Promise ===
test("Promise.resolve", function() { var v; Promise.resolve(42).then(function(x){v=x;}); return v === 42; });
test("Promise.all", function() { var v; Promise.all([Promise.resolve(1), Promise.resolve(2)]).then(function(arr){v=arr;}); return v && v.length === 2; });

// === Error Types ===
test("TypeError", function() { return new TypeError("t").name === "TypeError"; });
test("RangeError", function() { return new RangeError("r").name === "RangeError"; });

// === DOM APIs ===
test("document.getElementById", function() { return document.getElementById("title") !== null; });
test("document.createElement", function() { var d = document.createElement("div"); return d.tagName === "DIV"; });
test("element.classList", function() { var d = document.createElement("div"); d.classList.add("foo"); return d.classList.contains("foo"); });
test("element.setAttribute", function() { var d = document.createElement("div"); d.setAttribute("id","test"); return d.getAttribute("id") === "test"; });
test("element.innerHTML", function() { var d = document.createElement("div"); d.innerHTML = "<span>hi</span>"; return d.innerHTML === "<span>hi</span>"; });
test("element.children", function() { var d = document.createElement("div"); d.appendChild(document.createElement("p")); return d.children.length === 1; });
test("element.remove", function() { var p = document.createElement("div"); var c = document.createElement("span"); p.appendChild(c); c.remove(); return p.children.length === 0; });

// === Web APIs ===
test("URLSearchParams", function() { var u = new URLSearchParams("a=1&b=2"); return u.get("a") === "1" && u.get("b") === "2"; });
test("TextEncoder", function() { var e = new TextEncoder(); return e.encode("A").length === 1; });
test("performance.now", function() { return typeof performance.now() === "number"; });
test("navigator.userAgent", function() { return navigator.userAgent.length > 0; });
test("window.innerWidth", function() { return window.innerWidth > 0; });

// === Output Results ===
var el = document.getElementById("results");
el.innerHTML = '<h2 style="margin-bottom:10px">' + pass + ' passed, ' + fail + ' failed</h2>' + results.join("");
document.title = pass + "/" + (pass+fail) + " tests passed";
</script>
</body></html>
