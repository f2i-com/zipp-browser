<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">ZIPP Browser — Part of the ZIPP Project. Native Web &amp; SoftN Browser.</title>
  <desc id="desc">A dark violet-to-teal banner matching ZIPP's official brand identity, featuring the angular purple-to-cyan lightning mark, ZIPP Browser wordmark, "Part of the ZIPP Project", and capability badges.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#24124d"/>
      <stop offset="1" stop-color="#083b4c"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="27" fill="none" stroke="#a78bfa" stroke-opacity="0.22" stroke-width="2"/>
  <g transform="translate(0 -28)">
    <g opacity="0.18" stroke="#a78bfa" stroke-width="2">
      <path d="M0 68h260M0 106h205M0 144h150"/>
      <path d="M940 214h260M995 252h205M1050 290h150"/>
    </g>
    <circle cx="215" cy="178" r="106" fill="#7c3aed" opacity="0.15" filter="url(#glow)"/>
    <circle cx="215" cy="178" r="90" fill="none" stroke="#a78bfa" stroke-opacity="0.36" stroke-width="2"/>
    <path d="M92 0 0 122h58l-25 86L142 69h-62z" transform="translate(144 74)" fill="url(#bolt)" filter="url(#glow)"/>

    <text x="356" y="170" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="102" font-weight="700" letter-spacing="-3">ZIPP</text>
    <text x="604" y="138" fill="#c4b5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="700" letter-spacing="-0.5">Browser</text>
    <text x="606" y="168" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="0.3">PART OF THE ZIPP PROJECT</text>

    <rect x="358" y="188" width="760" height="1.5" fill="url(#accentLine)"/>

    <text x="360" y="222" fill="#d8d4fe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="0.6">NATIVE WEB &amp; SOFTN BROWSER · STYLO + TAFFY + TINY-SKIA</text>

    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle">
      <rect x="360" y="250" width="128" height="40" rx="20" fill="#ffffff" fill-opacity="0.09" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="1"/>
      <text x="424" y="276" fill="#ede9fe">ZIPP VM</text>

      <rect x="502" y="250" width="126" height="40" rx="20" fill="#ffffff" fill-opacity="0.09" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="1"/>
      <text x="565" y="276" fill="#ede9fe">Portable</text>

      <rect x="642" y="250" width="166" height="40" rx="20" fill="#ffffff" fill-opacity="0.09" stroke="#67e8f9" stroke-opacity="0.25" stroke-width="1"/>
      <text x="725" y="276" fill="#cffafe">WebGL / GPU</text>

      <rect x="822" y="250" width="132" height="40" rx="20" fill="#ffffff" fill-opacity="0.09" stroke="#67e8f9" stroke-opacity="0.25" stroke-width="1"/>
      <text x="888" y="276" fill="#cffafe">Windows</text>

      <rect x="968" y="250" width="126" height="40" rx="20" fill="#ffffff" fill-opacity="0.09" stroke="#67e8f9" stroke-opacity="0.25" stroke-width="1"/>
      <text x="1031" y="276" fill="#cffafe">Android</text>
    </g>
  </g>
</svg>
