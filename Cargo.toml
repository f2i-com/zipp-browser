[workspace]
members = [
    "crates/zipp-dom",
    "crates/zipp-renderer",
    "crates/zipp-shell",
    "apps/browser",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.92.0"

[workspace.dependencies]
# In-repo crates
zipp-dom = { version = "0.1.0", path = "./crates/zipp-dom", default-features = false }
zipp-renderer = { version = "0.1.0", path = "./crates/zipp-renderer", default-features = false }
zipp-shell = { version = "0.1.0", path = "./crates/zipp-shell", default-features = false }

# Servo dependencies
style = { version = "0.14.0", package = "stylo" }
style_traits = { version = "0.14.0", package = "stylo_traits" }
style_atoms = { version = "0.14.0", package = "stylo_atoms" }
style_config = { version = "0.14.0", package = "stylo_static_prefs" }
style_dom = { version = "0.14.0", package = "stylo_dom" }
selectors = { version = "0.36.0", package = "selectors" }
cssparser = { version = "0.36" }

# HTML5ever dependencies
markup5ever = "0.37.0"
html5ever = "0.37.0"
xml5ever = "0.37.0"

# Other Servo dependencies
euclid = "0.22"
atomic_refcell = "0.1.13"
app_units = "0.7.5"
smallvec = "1"

# Taffy (exact git rev from blitz upstream)
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "df2663aad35801f7522f6878a0300646dfe624f7", default-features = false, features = [
    "std",
    "flexbox",
    "grid",
    "block_layout",
    "content_size",
    "calc",
    "detailed_layout_info",
] }

# AnyRender (software rendering only — no vello, no wgpu)
anyrender = { version = "0.8" }
anyrender_svg = { version = "0.9" }

# Linebender + Fontations
color = "0.3"
linebender_resource_handle = "0.1"
peniko = "0.6.0"
kurbo = "0.13"
parley = { git = "https://github.com/linebender/parley", rev = "07980878fc9ea4b16ddc197ac789d01fb8ada7a3", default-features = false, features = [
    "std",
] }
skrifa = { version = "0.40", default-features = false, features = [
    "std",
] }

# TinySkia software renderer
tiny-skia = "0.11"
read-fonts = "0.37"
softbuffer = "0.4"

# SVG
usvg = "0.46"

# Windowing & Input
raw-window-handle = "0.6.0"
winit = { version = "=0.31.0-beta.2" }
arboard = { version = "3.4.1", default-features = false }
rfd = { version = "0.17.1", default-features = false }
keyboard-types = "0.7"
cursor-icon = "1"

# IO & Networking
url = "2.5.0"
http = "1.1.0"
data-url = "0.3.1"
tokio = "1.42"
reqwest = { version = "0.12", default-features = false }
reqwest-middleware = { version = "0.4.2", default-features = false }
http-cache-reqwest = { version = "=1.0.0-alpha.2", default-features = false }

# Media & Decoding
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico"] }
woff = { version = "0.6", default-features = false }
wuff = "0.2"
html-escape = "0.2.13"
percent-encoding = "2.3.1"
serde = "1"

# Other dependencies
rustc-hash = "1.1.0"
bytes = "1.7.1"
slab = "0.4.9"
tracing = "0.1.40"
tracing-subscriber = "0.3"
futures-util = "0.3.30"
futures-intrusive = "0.5.0"
smol_str = "0.3"
bitflags = "2.8.0"
bytemuck = "1"
fastrand = "2.3.0"
rayon = "1"
thread_local = "1"

# MEASURED 2026-07-28: the shipped binary is built with `--release`, which never
# saw `[profile.production]` below, so zipp-vm was compiled at cargo's stock
# release defaults -- no cross-crate inlining, system allocator. A controlled A/B
# on an identical 8.4MB script: 2500ms with these settings vs 6364ms without.
# 2.5x, for nothing but build time. The JS compiler front end is allocation-bound
# (a HashSet<String> per scope per capture walk), which is exactly why ZIPP
# adopted mimalloc for the same code.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.profile]
inherits = "release"
debug = true

[profile.production]
inherits = "release"
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[profile.p2]
inherits = "production"
opt-level = 2

[profile.small]
inherits = "production"
opt-level = "s"
panic = "abort"

[profile.tiny]
inherits = "small"
opt-level = "z"

# Stylo 0.14 with one fix, so `light-dark()` and dark system colours work.
# See third_party/stylo/ZIPP_PATCHES.md.
[patch.crates-io]
stylo = { path = "third_party/stylo" }
